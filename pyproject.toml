[project]
name = "retail-sales-pipeline"
version = "0.1.0"
description = "Medallion lakehouse pipeline for the UCI Online Retail II dataset on Microsoft Fabric"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "deltalake",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
